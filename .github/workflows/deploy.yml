name: Deploy

# Rolls the Azure Container App to an image tag already published to GHCR.
# Called by Release after the image job; run by hand to redeploy or roll back.
on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy or roll back to (e.g. v1.2.3)
        required: true
        type: string

# One deploy at a time: never two rollouts racing on the single SQLite writer.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # OIDC subject is repo:<owner>@<ownerId>/<repo>@<repoId>:environment:production (infra/setup-github-oidc.sh).
    environment: production
    env:
      RG: cellar-rg
      APP: cellar-app
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Normalise image name
        run: echo "IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Roll out new revision
        run: |
          # Single revision mode: traffic moves only once the new revision passes its
          # startup/readiness probes (GET /health, infra/main.bicep); until then the
          # previous revision keeps serving.
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" -o none

      - name: Wait for the new revision to be ready
        run: |
          for _ in $(seq 1 60); do
            LATEST="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)"
            READY="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)"
            REV_IMAGE="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST"               --query 'properties.template.containers[0].image' -o tsv)"
            REV_STATE="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST"               --query 'properties.provisioningState' -o tsv)"
            echo "latest=$LATEST ($REV_IMAGE, $REV_STATE) ready=$READY"
            if [ "$REV_IMAGE" = "$IMAGE" ]; then
              [ "$REV_STATE" = "Failed" ] && break
              [ "$LATEST" = "$READY" ] && { echo "Deployed $IMAGE as $LATEST"; exit 0; }
            fi
            sleep 10
          done
          echo "::error::Revision not ready; previous revision keeps serving. Recent logs:"
          az containerapp logs show -g "$RG" -n "$APP" --tail 50 || true
          exit 1
