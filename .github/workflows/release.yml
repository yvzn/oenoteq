name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: webapp/web
        run: |
          npm ci
          npm run build

      - name: Embed frontend build
        run: |
          rm -rf webapp/internal/static/dist
          cp -r webapp/web/dist webapp/internal/static/dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: webapp/go.mod

      - name: Build Windows executable
        working-directory: webapp
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o ../cellar.exe .

      - name: Zip release artifact
        run: zip cellar-windows-amd64.zip cellar.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cellar-windows-amd64.zip

  # Signed, sideloadable APK attached to the release created above. Runs after
  # `release` so the release already exists (two jobs creating it would race).
  # Independent of image/deploy: a failure here never blocks a rollout.
  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          # vMAJOR.MINOR.PATCH[-suffix] -> versionName MAJOR.MINOR.PATCH, versionCode MAJOR*10000+MINOR*100+PATCH
          VERSION="${GITHUB_REF_NAME#v}"
          CORE="${VERSION%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          case "$MAJOR$MINOR$PATCH" in ''|*[!0-9]*) echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1;; esac
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android/Oenoteq
        run: >
          ./gradlew assembleRelease
          -PappVersionName="$APP_VERSION_NAME"
          -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify APK signature
        run: |
          APK="$(ls android/Oenoteq/app/build/outputs/apk/release/*.apk | head -n 1)"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          cp "$APK" "oenoteq-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: oenoteq-${{ github.ref_name }}.apk

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
